name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_booking_sys
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_booking_sys"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      test_connString: Host=localhost;Port=5432;Database=test_booking_sys;Username=postgres;Password=ci_only_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar dependências
        run: dotnet restore API.Tests/API.Tests.csproj
      - name: Compilar API e testes
        run: dotnet build API.Tests/API.Tests.csproj --configuration Release --no-restore
      - name: Executar testes com PostgreSQL
        run: dotnet test API.Tests/API.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend - lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar código
        run: npm run lint
      - name: Executar testes
        run: npm run test -- --run
      - name: Compilar frontend
        run: npm run build
